# Render.com deployment configuration for KhanijSetu
# This file auto-configures the backend service on Render

services:
  - type: web
    name: khanijsetu-backend
    runtime: python
    rootDir: backend
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "480"
      - key: UPLOAD_DIR
        value: ./uploads
      - key: MAX_FILE_SIZE
        value: "10485760"
      - key: ALLOWED_UPLOAD_EXTENSIONS
        value: ".csv,.xlsx,.xls,.pdf,.jpg,.jpeg,.png"
      - key: DATABASE_URL
        sync: false   # You will paste the Neon PostgreSQL URL here
      - key: CORS_ORIGINS
        sync: false   # You will paste the Vercel frontend URL here
